name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Check CLI entry point
        run: chatgpt-extract-markdown --help

      - name: Run tests
        run: pytest

      - name: Run pyrefly strict
        run: pyrefly check --preset strict

      - name: Enforce 100% strict type coverage
        run: pyrefly coverage check --strict --fail-under 100
